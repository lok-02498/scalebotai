# =============================================================================
# ScaleBotAI - NGINX main configuration (/etc/nginx/nginx.conf)
# -----------------------------------------------------------------------------
# Global/process tuning and http-wide defaults live here. The virtual servers
# (upstream, :80, :443, :8080) are in conf.d/scalebotai.conf, included at the end.
# Validate inside the running container with:  docker compose exec nginx nginx -t
# =============================================================================

user  nginx;

# One worker process per CPU core the container can see. Each worker is a
# single-threaded event loop that can juggle thousands of connections.
worker_processes  auto;

# Every proxied request uses 2 file descriptors (client + upstream socket), so the
# per-worker FD limit must comfortably exceed 2 x worker_connections.
worker_rlimit_nofile  65535;

pid        /var/run/nginx.pid;
# The official image symlinks this file to the container's stderr -> `docker logs nginx`.
error_log  /var/log/nginx/error.log warn;

events {
    # Max simultaneous connections per worker (clients + upstream keepalive sockets).
    worker_connections  4096;
    # Accept all pending connections at once when a worker wakes up.
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # -------------------------------------------------------------------------
    # Core performance / connection handling
    # -------------------------------------------------------------------------
    server_tokens              off;    # hide the NGINX version in headers and error pages
    sendfile                   on;
    tcp_nopush                 on;
    tcp_nodelay                on;
    keepalive_timeout          65s;    # client-side keep-alive (browsers, k6, Locust)
    keepalive_requests         1000;   # requests allowed per client keep-alive connection
    reset_timedout_connection  on;     # free memory of timed-out clients immediately
    types_hash_max_size        2048;
    server_names_hash_bucket_size 64;

    # -------------------------------------------------------------------------
    # Request size / slow-client protection (chat messages are <= 2000 chars)
    # -------------------------------------------------------------------------
    client_max_body_size         1m;
    client_body_buffer_size      16k;
    client_header_buffer_size    1k;
    large_client_header_buffers  4 16k;   # room for long JWT Authorization headers
    client_header_timeout        15s;
    client_body_timeout          15s;
    send_timeout                 30s;

    # -------------------------------------------------------------------------
    # Request correlation ID
    # Re-use a well-formed incoming X-Request-ID, otherwise generate one
    # ($request_id = 32 random hex chars). It is forwarded to the API (which logs
    # and echoes it), written to the access log and returned to the client, so one
    # ID can be followed through NGINX -> API -> Elasticsearch/Kibana.
    # -------------------------------------------------------------------------
    map $http_x_request_id $req_id {
        default                        $request_id;
        "~^[A-Za-z0-9._:-]{8,128}$"    $http_x_request_id;
    }

    # -------------------------------------------------------------------------
    # Structured (JSON) access log: one object per line, parsed natively by
    # Logstash/Filebeat/Kibana. escape=json makes values JSON-safe.
    # The official image symlinks access.log to stdout -> `docker logs nginx`.
    # -------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"@timestamp":"$time_iso8601",'
            '"service":"nginx",'
            '"log_type":"access",'
            '"request_id":"$req_id",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"host":"$host",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_length":$request_length,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_connect_time":"$upstream_connect_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"ssl_protocol":"$ssl_protocol",'
            '"limit_req_status":"$limit_req_status",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    # -------------------------------------------------------------------------
    # Compression. JSON compresses ~70-90 %; tiny bodies are not worth the CPU.
    # (Responses are dynamic API JSON - no static assets are served here.)
    # -------------------------------------------------------------------------
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_types         application/json application/problem+json application/javascript
                       application/xml text/css text/plain text/xml image/svg+xml;

    # -------------------------------------------------------------------------
    # Rate limiting & connection limiting (leaky-bucket, per client IP)
    # The API also enforces a per-user/IP limit in Redis (RATE_LIMIT_PER_MINUTE);
    # NGINX is the outer, cheaper shield that drops floods before they reach Python.
    #
    # Load testing: from the host, all requests arrive from ONE Docker gateway IP.
    # Add the load generator's address/CIDR to the geo block below to exempt it
    # (an empty key is never counted by limit_req/limit_conn).
    # -------------------------------------------------------------------------
    geo $rate_limit_exempt {
        default        0;
        # 172.16.0.0/12  1;   # e.g. uncomment to exempt the Docker bridge gateway during k6 runs
    }
    map $rate_limit_exempt $rate_limit_key {
        0   $binary_remote_addr;
        1   "";
    }

    # General API traffic: 50 req/s sustained per IP (bursts allowed per location).
    limit_req_zone   $rate_limit_key  zone=api_per_ip:20m   rate=50r/s;
    # Login/register: brute-force & signup-spam protection, 30 req/min per IP.
    limit_req_zone   $rate_limit_key  zone=auth_per_ip:10m  rate=30r/m;
    # Concurrent connections per IP.
    limit_conn_zone  $rate_limit_key  zone=conn_per_ip:10m;

    limit_req_status     429;
    limit_conn_status    429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    # -------------------------------------------------------------------------
    # Security headers (OWASP secure-headers baseline for a JSON API)
    # GOTCHA: add_header is inherited by server/location blocks ONLY if they do
    # not declare any add_header of their own. That is why the per-site config
    # avoids add_header except in @rate_limited, which repeats these lines.
    # HSTS is sent only on HTTPS responses ($https = "on"): an empty value means
    # the header is omitted.
    # CSP is intentionally not set here: the API returns JSON (nosniff covers it),
    # and FastAPI's Swagger UI at /docs loads its assets from a CDN.
    # -------------------------------------------------------------------------
    map $https $hsts_header {
        on       "max-age=63072000; includeSubDomains";
        default  "";
    }

    add_header Strict-Transport-Security  $hsts_header always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "DENY" always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header X-Request-ID               $req_id always;

    # NGINX is the single owner of these headers at the edge: drop any copies the
    # upstream may send so clients never receive duplicates.
    proxy_hide_header  X-Powered-By;
    proxy_hide_header  Strict-Transport-Security;
    proxy_hide_header  X-Content-Type-Options;
    proxy_hide_header  X-Frame-Options;
    proxy_hide_header  Referrer-Policy;
    proxy_hide_header  Permissions-Policy;
    proxy_hide_header  X-Request-ID;

    # -------------------------------------------------------------------------
    # Proxy buffering defaults (API responses are small JSON documents)
    # -------------------------------------------------------------------------
    proxy_buffering          on;
    proxy_buffer_size        16k;
    proxy_buffers            16 16k;
    proxy_busy_buffers_size  32k;

    # Virtual servers / upstreams
    include /etc/nginx/conf.d/*.conf;
}
