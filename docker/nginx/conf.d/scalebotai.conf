# =============================================================================
# ScaleBotAI - virtual servers (/etc/nginx/conf.d/scalebotai.conf)
# -----------------------------------------------------------------------------
#   upstream scalebotai_api   -> every chatbot-api replica on port 8000 (round-robin)
#   server :80                -> 301 redirect to HTTPS (except /nginx-health)
#   server :443 (TLS, HTTP/2) -> public API entry point
#   server :8080              -> internal stub_status for nginx-prometheus-exporter
# =============================================================================

# -----------------------------------------------------------------------------
# Docker's embedded DNS server. Every container on a user-defined network uses
# 127.0.0.11 to resolve service names; for a scaled service (chatbot-api x3) it
# returns one A record per replica. valid=10s -> re-resolve every 10 seconds.
# -----------------------------------------------------------------------------
resolver          127.0.0.11 valid=10s ipv6=off;
resolver_timeout  5s;

# -----------------------------------------------------------------------------
# Upstream pool. With "resolve" (OSS NGINX >= 1.27.3) the name is re-resolved
# at runtime, so replicas added/removed by `docker compose up --scale` are picked
# up automatically, and NGINX still starts even if the API is not resolvable yet.
# "resolve" requires the group to live in shared memory -> the "zone" directive.
# -----------------------------------------------------------------------------
upstream scalebotai_api {
    zone scalebotai_api 128k;

    # Default algorithm = weighted round-robin across all resolved addresses.
    # (least_conn is a good alternative when LLM-mode requests have very uneven latency.)
    server chatbot-api:8000 resolve max_fails=3 fail_timeout=10s;

    # Re-use TCP connections to the API instead of a new handshake per request.
    keepalive           64;     # idle connections cached per worker
    keepalive_requests  1000;
    # MUST be shorter than uvicorn's --timeout-keep-alive (default 5 s); otherwise
    # NGINX may reuse a socket the API has just closed -> sporadic 502s.
    keepalive_timeout   4s;
}

# =============================================================================
# :80 - plain HTTP. Redirect everything to HTTPS, except the probe endpoint
# used by the container HEALTHCHECK and external load balancers.
# =============================================================================
server {
    listen       80 default_server;
    server_name  _;

    location = /nginx-health {
        access_log    off;
        default_type  text/plain;
        return 200    "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# :443 - public HTTPS entry point (TLS terminated here; plain HTTP to the API
# over the private "frontend" Docker network).
# =============================================================================
server {
    listen       443 ssl default_server;
    http2        on;
    server_name  api.scalebotai.local localhost;

    # ---- TLS ----------------------------------------------------------------
    # Self-signed pair generated at first start by
    # /docker-entrypoint.d/10-generate-self-signed-cert.sh (mount real certs here in prod).
    ssl_certificate            /etc/nginx/certs/tls.crt;
    ssl_certificate_key        /etc/nginx/certs/tls.key;
    ssl_protocols              TLSv1.2 TLSv1.3;
    # Mozilla "intermediate" profile (TLS 1.2 ciphers; TLS 1.3 suites are fixed by OpenSSL).
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;   # ~40k sessions; resumption skips full handshakes
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    # HSTS (Strict-Transport-Security) is added http-wide in nginx.conf for HTTPS responses.

    # ---- Proxy defaults for every location below ---------------------------
    # (inherited because no location declares its own proxy_set_header)
    proxy_http_version  1.1;                 # required for upstream keepalive
    proxy_set_header    Connection         "";
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    # NGINX is the edge: OVERWRITE (not append) X-Forwarded-For so a client cannot
    # spoof its IP to dodge the API's per-IP rate limit (uvicorn trusts these headers).
    proxy_set_header    X-Forwarded-For    $remote_addr;
    proxy_set_header    X-Forwarded-Proto  $scheme;
    proxy_set_header    X-Forwarded-Host   $host;
    proxy_set_header    X-Forwarded-Port   $server_port;
    proxy_set_header    X-Request-ID       $req_id;

    proxy_connect_timeout  5s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    # If a replica is down/restarting, transparently retry the NEXT replica.
    # NGINX never retries non-idempotent requests (POST/PATCH) unless told to,
    # so a chat message is never sent twice.
    proxy_next_upstream          error timeout http_502 http_503;
    proxy_next_upstream_tries    2;
    proxy_next_upstream_timeout  10s;

    # Errors generated by NGINX itself are returned in the API's error envelope.
    # (Errors produced by the API are passed through untouched.)
    error_page 403         = @forbidden;
    error_page 429         = @rate_limited;
    error_page 502 503 504 = @upstream_unavailable;

    # ---- Auth: strict per-IP limit against credential stuffing / signup spam ---
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req   zone=auth_per_ip  burst=20  nodelay;
        limit_req   zone=api_per_ip   burst=100 nodelay;
        limit_conn  conn_per_ip 50;
        proxy_pass  http://scalebotai_api;
    }

    # ---- Chat: may call the LLM (Ollama) -> longer read timeout --------------
    # The API itself gives up on Ollama after OLLAMA_TIMEOUT_SECONDS (20 s) and
    # falls back to the rule engine, so 60 s is a generous ceiling.
    location = /api/v1/chat {
        limit_req           zone=api_per_ip burst=100 nodelay;
        limit_conn          conn_per_ip 100;
        proxy_send_timeout  60s;
        proxy_read_timeout  60s;
        proxy_pass          http://scalebotai_api;
    }

    # ---- All other business APIs --------------------------------------------
    location /api/ {
        limit_req   zone=api_per_ip burst=100 nodelay;
        limit_conn  conn_per_ip 100;
        proxy_pass  http://scalebotai_api;
    }

    # ---- Health endpoints (aggregate, liveness, readiness) -------------------
    location = /health {
        limit_req   zone=api_per_ip burst=50 nodelay;
        proxy_pass  http://scalebotai_api;
    }

    location /health/ {
        limit_req   zone=api_per_ip burst=50 nodelay;
        proxy_pass  http://scalebotai_api;
    }

    # ---- Prometheus metrics are INTERNAL ONLY ---------------------------------
    # Prometheus scrapes chatbot-api:8000/metrics directly over the "monitoring"
    # network; the public edge must never expose them.
    location ^~ /metrics {
        access_log  off;
        deny        all;
    }

    # ---- Interactive API docs (FastAPI Swagger UI / ReDoc / OpenAPI schema) --
    location ~ ^/(docs|redoc|openapi\.json) {
        limit_req   zone=api_per_ip burst=50 nodelay;
        proxy_pass  http://scalebotai_api;
    }

    # ---- Anything else: JSON 404 in the API's error envelope ------------------
    location / {
        default_type  application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"No route matches this path","details":null,"request_id":"$req_id"}}';
    }

    # ---- Named locations for NGINX-generated errors --------------------------
    location @forbidden {
        default_type  application/json;
        return 403 '{"error":{"code":"FORBIDDEN","message":"Access to this resource is forbidden","details":null,"request_id":"$req_id"}}';
    }

    location @rate_limited {
        default_type  application/json;
        # Declaring add_header here disables inheritance from nginx.conf, so the
        # security headers are repeated (see the GOTCHA note in nginx.conf).
        add_header Retry-After                1 always;
        add_header Strict-Transport-Security  $hsts_header always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header X-Frame-Options            "DENY" always;
        add_header Referrer-Policy            "no-referrer" always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
        add_header X-Request-ID               $req_id always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests - slow down and retry","details":null,"request_id":"$req_id"}}';
    }

    location @upstream_unavailable {
        default_type  application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The API is temporarily unavailable, please retry shortly","details":null,"request_id":"$req_id"}}';
    }
}

# =============================================================================
# :8080 - INTERNAL status server. Not published to the host in docker-compose.yml;
# reachable only by containers on the same Docker network (nginx-exporter).
# Defence in depth: stub_status also only answers private address ranges.
# =============================================================================
server {
    listen       8080;
    server_name  _;
    access_log   off;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    location = /nginx-health {
        default_type  text/plain;
        return 200    "ok\n";
    }

    location / {
        return 404;
    }
}
