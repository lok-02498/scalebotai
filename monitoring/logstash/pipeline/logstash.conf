# =============================================================================
# ScaleBotAI - Logstash pipeline
# -----------------------------------------------------------------------------
# Mounted at /usr/share/logstash/pipeline/logstash.conf.
#
# The API writes ONE JSON object per line with these fields (see docs/09-monitoring-logging.md):
#   @timestamp, level, logger, message, service="scalebotai-api", environment,
#   hostname, log_type (api|user|error|system) and, when relevant, request_id,
#   user_id, method, path, route, status_code, latency_ms, client_ip,
#   user_agent, event, exc_info.
#
# Two inputs feed the same filter/output chain:
#   * file  - Docker Compose: chatbot-api appends to /var/log/scalebotai/app.log
#             on the shared `app-logs` volume; Logstash tails it.
#   * beats - Kubernetes: Filebeat DaemonSet ships container stdout
#             (monitoring/filebeat/filebeat.yml) to logstash.logging.svc:5044.
#
# Output: one Elasticsearch index per log type and day:
#   scalebot-api-logs-YYYY.MM.dd     access log, one line per HTTP request
#   scalebot-user-logs-YYYY.MM.dd    register / login / logout / password / delete
#   scalebot-error-logs-YYYY.MM.dd   level >= ERROR, 5xx, exceptions
#   scalebot-system-logs-YYYY.MM.dd  startup / shutdown / dependency events
#
# Test the syntax:
#   docker compose exec logstash bin/logstash --config.test_and_exit \
#     -f /usr/share/logstash/pipeline/logstash.conf --path.data /tmp/lstest
# =============================================================================

input {
  # --- Docker Compose: tail the application log file -------------------------
  file {
    id             => "scalebotai_app_log_file"
    path           => "/var/log/scalebotai/*.log"
    codec          => json                      # each line is a JSON document
    start_position => "beginning"               # read existing content on first start
    sincedb_path   => "/usr/share/logstash/data/sincedb-scalebotai"  # remembers read offsets across restarts
    mode           => "tail"
    # ECS field names for the input's own metadata: the file name goes to
    # [log][file][path] and the Logstash host to [host][name], so they never
    # clash with the app's request `path` field.
    ecs_compatibility => "v8"
    add_field      => { "[@metadata][source]" => "file" }
  }

  # --- Kubernetes: events shipped by the Filebeat DaemonSet -------------------
  beats {
    id        => "scalebotai_beats"
    port      => 5044
    add_field => { "[@metadata][source]" => "beats" }
  }
}

filter {
  # ---------------------------------------------------------------------------
  # 1. Beats: Filebeat's decode_json_fields normally already expanded the app's
  #    JSON into the event root. If it did not (e.g. a different Filebeat config)
  #    and `message` still looks like a JSON object, parse it here into the root.
  # ---------------------------------------------------------------------------
  if [@metadata][source] == "beats" {
    if [message] =~ /^\s*\{.*\}\s*$/ {
      json {
        id                   => "parse_beats_json"
        source               => "message"
        skip_on_invalid_json => true             # plain-text lines are kept as-is
        # no `target` => parsed keys are merged into the event root
      }
    }
    # Filebeat bookkeeping that is not useful for searching
    mutate {
      id           => "drop_beats_noise"
      remove_field => [ "[agent][ephemeral_id]", "[agent][id]", "[agent][version]", "[ecs]", "[input]", "[log][offset]", "[stream]" ]
    }
  }

  # ---------------------------------------------------------------------------
  # 2. File input: the file name is already in [log][file][path] (same place
  #    Filebeat puts it). Drop [host] - it would be the Logstash container, while
  #    the app's own `hostname` field identifies the replica that logged.
  # ---------------------------------------------------------------------------
  if [@metadata][source] == "file" {
    mutate {
      id           => "normalise_file_fields"
      remove_field => [ "host" ]
    }
  }

  # ---------------------------------------------------------------------------
  # 3. log_type: default to "system" when missing/empty and only allow the four
  #    known values - log_type is part of the index name, so arbitrary values
  #    would create arbitrary indices.
  # ---------------------------------------------------------------------------
  if ![log_type] or [log_type] == "" {
    mutate { id => "default_log_type" replace => { "log_type" => "system" } }
  }
  mutate { id => "lowercase_log_type" lowercase => [ "log_type" ] }
  if [log_type] not in [ "api", "user", "error", "system" ] {
    mutate {
      id      => "unknown_log_type"
      add_tag => [ "unknown_log_type" ]
      replace => { "log_type" => "system" }
    }
  }

  # Normalise level so Kibana filters are consistent (INFO, WARNING, ERROR ...)
  if [level] {
    mutate { id => "uppercase_level" uppercase => [ "level" ] }
  }

  # ---------------------------------------------------------------------------
  # 4. Errors: every ERROR/CRITICAL event must be searchable in the error index.
  #    If the app logged it under another type (e.g. a `user` event at ERROR
  #    level), keep the original in its own index and send a COPY tagged
  #    `error_copy` to scalebot-error-logs-*. Clones only run through the
  #    filters below this point.
  # ---------------------------------------------------------------------------
  if [level] in [ "ERROR", "CRITICAL", "FATAL" ] and [log_type] != "error" {
    clone {
      id     => "clone_to_error_index"
      clones => [ "error_copy" ]
    }
  }
  # (with ecs_compatibility disabled the clone name is written to `type`; with
  #  ECS enabled it is added to `tags` - handle both)
  if [type] == "error_copy" or "error_copy" in [tags] {
    # two steps: mutate applies add_field AFTER replace, so remember the
    # original type first
    mutate {
      id        => "remember_original_log_type"
      add_field => { "original_log_type" => "%{[log_type]}" }
    }
    mutate {
      id           => "mark_error_copy"
      replace      => { "log_type" => "error" }
      remove_field => [ "type" ]
      add_tag      => [ "error_copy" ]
    }
  }
  if [log_type] == "error" {
    mutate { id => "tag_error" add_tag => [ "error" ] }
  }

  # ---------------------------------------------------------------------------
  # 5. Timestamp. The app writes `@timestamp` as ISO-8601 UTC; the json codec /
  #    json filter already promote a valid value to the event @timestamp. When
  #    Logstash cannot parse it, the raw value is moved to `_@timestamp` and the
  #    event gets `_timestampparsefailure` - recover it here with the date filter
  #    (several formats), otherwise the ingest time is kept.
  # ---------------------------------------------------------------------------
  if [_@timestamp] {
    date {
      id             => "recover_timestamp"
      match          => [ "_@timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss.SSS", "UNIX", "UNIX_MS" ]
      target         => "@timestamp"
      timezone       => "UTC"
      remove_field   => [ "_@timestamp" ]
      remove_tag     => [ "_timestampparsefailure" ]
      tag_on_failure => [ "_dateparsefailure" ]
    }
  }

  # ---------------------------------------------------------------------------
  # 6. Types: make numeric fields numeric so Kibana can aggregate them
  #    (percentiles on latency_ms, ranges on status_code). No-op when absent.
  # ---------------------------------------------------------------------------
  mutate {
    id      => "convert_numeric_fields"
    convert => {
      "status_code" => "integer"
      "latency_ms"  => "float"
    }
  }

  # ---------------------------------------------------------------------------
  # 7. Remove noisy / duplicated fields.
  #    [event][original] would store every line twice.
  # ---------------------------------------------------------------------------
  mutate {
    id           => "remove_noise"
    remove_field => [ "@version", "[event][original]", "[log][flags]" ]
  }

  # ---------------------------------------------------------------------------
  # 8. GeoIP intentionally skipped: in this lab client_ip is a private/Docker
  #    address (NGINX -> API) so lookups would only add empty fields. For a
  #    public deployment enable:
  #    geoip { source => "client_ip" target => "client_geo" tag_on_failure => [] }
  # ---------------------------------------------------------------------------
}

output {
  elasticsearch {
    id          => "es_scalebotai"
    hosts       => [ "http://elasticsearch:9200" ]   # xpack security disabled for local dev only
    index       => "scalebot-%{[log_type]}-logs-%{+YYYY.MM.dd}"
    data_stream => "false"                            # classic daily indices (index pattern scalebot-*-logs-*)
    # Index template + ILM policy are created by monitoring/kibana/create-data-views.sh
    manage_template => false
  }

  # Debug: print every processed event to `docker compose logs logstash`.
  # stdout { codec => rubydebug { metadata => true } }
}
