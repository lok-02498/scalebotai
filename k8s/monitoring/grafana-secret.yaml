# =============================================================================
# Grafana admin credentials (Secret `grafana-admin`, namespace monitoring)
# =============================================================================
# PLACEHOLDER password — replace before any shared/production use:
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 18)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n monitoring rollout restart deployment/grafana
# This is the Kubernetes home of GRAFANA_ADMIN_PASSWORD from .env.example
# (secrets cannot be shared across namespaces, so it is not in
# scalebotai-secrets). Note: Grafana only applies the env password when its
# database is first created; afterwards change it in the UI or with
#   kubectl -n monitoring exec deploy/grafana -- grafana cli admin reset-admin-password <new>
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "change-me-grafana-password"
