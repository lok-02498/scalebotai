# =============================================================================
# Prometheus identity + read-only discovery permissions
# =============================================================================
# kubernetes_sd_configs asks the Kubernetes API "which pods / nodes exist and
# what are their IPs, labels and annotations?" — that needs list/watch rights
# cluster-wide, hence a ClusterRole (pods live in several namespaces, nodes are
# cluster-scoped).
#
# Least privilege: we scrape the kubelet/cAdvisor DIRECTLY on each node's
# :10250 which only needs `nodes/metrics`. We intentionally do NOT grant
# `nodes/proxy` (the API-server proxy route), because nodes/proxy is
# effectively a path to the kubelet API and is far more powerful than reading
# metrics.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
# Prometheus DOES call the Kubernetes API (service discovery) and the kubelet
# (bearer-token auth), so it needs the projected token.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-scalebotai
  labels:
    app.kubernetes.io/name: prometheus
rules:
  # Service discovery (role: pod / node / endpoints / service).
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Kubelet /metrics and /metrics/cadvisor (kubelet authorises the scrape via
  # a SubjectAccessReview for nodes/metrics).
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  # Scraping the API server's own /metrics (optional).
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-scalebotai
  labels:
    app.kubernetes.io/name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-scalebotai
