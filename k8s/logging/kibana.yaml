# =============================================================================
# Kibana 8.15 — search & visualise the logs (namespace logging)
# =============================================================================
# UI:  kubectl -n logging port-forward svc/kibana 5601:5601
#      http://localhost:5601 -> Stack Management -> Data Views -> create
#      "scalebot-*" with time field @timestamp -> Discover.
# Useful KQL:  log_type : "error"      kubernetes.labels.track : "canary"
#              status_code >= 500      user_id : "<uuid>"
# Optional public route: kibana-ingress.yaml (basic auth + TLS).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: log-ui
    app.kubernetes.io/version: "8.15.3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
        app.kubernetes.io/name: kibana
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # kibana user in the official image
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch.logging.svc:9200"
            - name: SERVER_NAME
              value: kibana
            # Cap the Node.js heap below the container memory limit.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=800"
          ports:
            - name: http
              containerPort: 5601
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
    app.kubernetes.io/name: kibana
spec:
  type: ClusterIP
  selector:
    app: kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
