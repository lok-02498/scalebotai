# =============================================================================
# 02-secret.yaml — SENSITIVE configuration (placeholders only!)
# =============================================================================
# !!! Every value below is a PLACEHOLDER. Never commit real secrets to Git. !!!
#
# How Kubernetes Secrets work (viva notes)
# ----------------------------------------
# * `data:` values must be base64-encoded; `stringData:` (used here) accepts
#   plain text and the API server base64-encodes it for you on write.
#       echo -n 'change-me' | base64        ->  Y2hhbmdlLW1l
#       echo 'Y2hhbmdlLW1l' | base64 -d     ->  change-me
# * base64 is an ENCODING, not ENCRYPTION. Anyone who can `kubectl get secret
#   -o yaml` can read it. Protection comes from:
#     1. RBAC — only the API's pods (via the kubelet) and cluster admins can
#        read this Secret; jenkins-deployer and scalebotai-viewer roles have
#        NO access to secrets (see 11-rbac.yaml).
#     2. Encryption at rest — configure the API server with an
#        EncryptionConfiguration (aescbc/aesgcm or a KMS v2 provider) so the
#        Secret is encrypted inside etcd. Managed clusters (EKS/GKE/AKS) offer
#        KMS envelope encryption as a checkbox.
#     3. Keeping secrets out of Git: use Sealed Secrets (encrypt with the
#        controller's public key, commit the SealedSecret, only the cluster can
#        decrypt) or External Secrets Operator (sync from AWS Secrets Manager,
#        HashiCorp Vault, GCP Secret Manager, Azure Key Vault).
# * Pods receive the values as env vars (envFrom secretRef) — they are never
#   baked into the image.
#
# Production: DELETE this file from the kustomization and create the Secret
# imperatively (or via Sealed/External Secrets) with strong random values:
#
#   kubectl -n scalebotai create secret generic scalebotai-secrets \
#     --from-literal=POSTGRES_USER=scalebot \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_PASSWORD="Adm1n-$(openssl rand -hex 8)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# (`--dry-run=client -o yaml | kubectl apply -f -` makes the command idempotent:
#  it creates the Secret the first time and updates it afterwards.)
#
# NOTE: after changing a Secret, restart consumers so they re-read env vars:
#   kubectl -n scalebotai rollout restart deployment/scalebotai-api
# Changing POSTGRES_PASSWORD here does NOT change the password inside an
# already-initialised database (initdb only runs on an empty volume) — use
# ALTER USER in psql as well.
#
# GRAFANA_ADMIN_PASSWORD (.env.example) is "monitoring only": Secrets cannot be
# read across namespaces, so it lives in Secret `grafana-admin` in the
# `monitoring` namespace (k8s/monitoring/grafana-secret.yaml), not here.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: scalebotai-secrets
  namespace: scalebotai
  labels:
    app.kubernetes.io/name: scalebotai-api
    app.kubernetes.io/component: secrets
# Opaque = arbitrary user-defined key/value data (other types: kubernetes.io/tls,
# kubernetes.io/dockerconfigjson, kubernetes.io/service-account-token, ...).
type: Opaque
stringData:
  # Used by the API (DB connection) AND by the postgres StatefulSet (initdb).
  POSTGRES_USER: "scalebot"
  POSTGRES_PASSWORD: "change-me-postgres-password"
  # Used by redis (--requirepass), the API and redis-exporter.
  REDIS_PASSWORD: "change-me-redis-password"
  # HS256 signing key for JWTs — must be long and random (>= 32 bytes).
  JWT_SECRET_KEY: "change-me-jwt-secret-key-use-openssl-rand-hex-32"
  # Bootstrap admin created at startup if missing (>= 8 chars, a letter and a digit).
  ADMIN_PASSWORD: "change-me-Admin123"
